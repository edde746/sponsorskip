<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SponsorSkip</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 290px;
        margin: 0;
        padding: 14px;
        background: #212121;
        color: #f1f1f1;
        font-family: Roboto, Arial, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 500;
      }
      #status {
        margin-bottom: 12px;
        padding: 8px;
        border-radius: 4px;
        background: #303030;
        line-height: 1.45;
      }
      #segments {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      #segments li {
        display: flex;
        justify-content: space-between;
        padding: 1px 0;
      }
      .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 2px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        cursor: pointer;
      }
      label span {
        flex: 1;
      }
      hr {
        border: none;
        border-top: 1px solid #3d3d3d;
        margin: 10px 0;
      }
      .muted {
        color: #aaa;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h1>SponsorSkip</h1>
    <div class="muted" id="model">&nbsp;</div>
    <div id="status">Loading&hellip;</div>

    <label><input type="checkbox" id="enabled" /><span>Enabled</span></label>
    <label><input type="checkbox" id="autoSkip" /><span>Skip automatically</span></label>
    <label
      ><input type="checkbox" id="showPreviewBar" /><span>Show on progress bar</span></label
    >

    <hr />

    <label><input type="checkbox" id="cat-sponsor" /><span>Sponsor</span></label>
    <label><input type="checkbox" id="cat-selfpromo" /><span>Self-promotion</span></label>

    <hr />
    <div class="muted">
      Runs entirely on your machine. Transcripts are fetched by your browser and
      never leave it.
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
