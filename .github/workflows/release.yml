name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with manifest.json ships a package whose reported
      # version is wrong. Chrome then refuses the update as "not newer", which is
      # silent and extremely annoying to diagnose after the fact.
      - name: Check version consistency
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          echo "tag=$VERSION manifest=$MANIFEST package=$PACKAGE"
          FAILED=0
          [ "$VERSION" = "$MANIFEST" ] || { echo "::error::manifest.json says $MANIFEST, tag says $VERSION"; FAILED=1; }
          [ "$VERSION" = "$PACKAGE" ] || { echo "::error::package.json says $PACKAGE, tag says $VERSION"; FAILED=1; }
          exit $FAILED

      - run: npm ci

      - name: Cache model artifacts
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('models.json') }}

      - name: Fetch models
        run: npm run fetch-models

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify dist
        run: npm run verify

      - name: Package
        id: package
        run: |
          VERSION='${{ steps.version.outputs.version }}'

          # Loadable package: unzip and "Load unpacked". Contains the weights, so
          # it also carries NOTICE.md explaining the two licences.
          ( cd dist && zip -qr "../sponsorskip-$VERSION-chrome.zip" . )

          # Code only, no weights. For anyone who would rather fetch the model
          # themselves, or keep the GPL code and NC weights strictly separate.
          git archive --format=zip --prefix="sponsorskip-$VERSION/" \
            -o "sponsorskip-$VERSION-source.zip" HEAD

          ls -lh sponsorskip-*.zip
          {
            echo "chrome_size=$(du -h "sponsorskip-$VERSION-chrome.zip" | cut -f1)"
            echo "source_size=$(du -h "sponsorskip-$VERSION-source.zip" | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          MODEL_REPO=$(node -p "require('./models.json').repo")
          cat > RELEASE_NOTES.md <<EOF
          Skips YouTube sponsor segments by reading the transcript. No
          crowd-sourced timestamps, no server, no telemetry. Segments are
          predicted from the video's own captions, so it works on videos nobody
          has ever labelled.

          ## Install

          Download \`sponsorskip-$VERSION-chrome.zip\` (${{ steps.package.outputs.chrome_size }}), unzip it,
          then in Chrome go to \`chrome://extensions\` → enable Developer mode →
          **Load unpacked** → select the unzipped folder.

          Requires Chrome 116+ (offscreen documents and WebGPU). There is no CPU
          fallback: the small model measured for one was ~11 s off at segment
          boundaries, which is worse than not skipping, so devices without WebGPU
          are told so explicitly instead.

          ## Engines

          | engine | delivery | F1 | mean abs start error |
          |---|---|---|---|
          | Base (default) | bundled | 0.808 | 2.98 s |
          | Large | 724 MB, downloaded once | **0.834** | **2.33 s** |
          | LLM | your own endpoint | 0.821 | — |

          Base and Large run locally on your GPU. Large is more accurate, most
          visibly at segment ends, and is fetched from HuggingFace on first use
          with a SHA-256 check.

          LLM mode sends the transcript to any OpenAI-compatible endpoint you
          configure with your own URL, key and model. It is an alternative rather
          than an upgrade: precision 0.923 against recall 0.740, so it flags less
          but is right more often when it does. Costs about \$0.00085 per video.

          **Skip edges** tunes how far segment edges expand — whether you would
          rather hear a second of ad or lose a second of content.

          ## Assets

          | asset | size | contents |
          |---|---|---|
          | \`sponsorskip-$VERSION-chrome.zip\` | ${{ steps.package.outputs.chrome_size }} | ready to load, base model included |
          | \`sponsorskip-$VERSION-source.zip\` | ${{ steps.package.outputs.source_size }} | code only, run \`npm run fetch-models\` |

          ## Licences

          Code is **GPL-3.0-or-later**. Model weights are **CC BY-NC-SA 4.0 —
          non-commercial**, inherited from the SponsorBlock database they were
          trained on. The \`chrome\` zip contains both; see \`NOTICE.md\` inside it.

          Weights: https://huggingface.co/$MODEL_REPO

          ## Accuracy caveats

          Numbers above are measured against SponsorBlock crowd labels on a
          channel-disjoint validation split, held-out half (~200 videos / ~530
          segments). Read them as tiers, not a ranking: the Base/Large F1 gap is
          borderline at this sample size, though the boundary metrics are
          consistently better for Large.

          Per-video variance is much larger than these averages. On one test video
          the local model over-extends ~6 s early and ~9 s late regardless of
          settings, because that segment's probability profile is broad. Short
          segments remain the weak point, and it is English-ASR only.

          See the model card for the full caveats.
          EOF
          cat RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          gh release create '${{ steps.version.outputs.tag }}' \
            --title "SponsorSkip $VERSION" \
            --notes-file RELEASE_NOTES.md \
            "sponsorskip-$VERSION-chrome.zip" \
            "sponsorskip-$VERSION-source.zip"
